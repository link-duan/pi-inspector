pre-commit:
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      exclude: "src/web/dist/**"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true

    - name: format
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,scss,less,html,md,mdx,yaml,yml}"
      exclude: "src/web/dist/**"
      run: bunx oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true
